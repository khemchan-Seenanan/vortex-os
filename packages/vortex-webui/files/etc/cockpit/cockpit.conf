# Vortex OS: Cockpit lives behind Caddy at https://<host>/system/.
# TLS terminates at Caddy; Cockpit only ever listens on 127.0.0.1:9090
# (socket drop-in), so AllowUnencrypted is safe here.
# Origins is deliberately unset: with a same-origin reverse proxy Cockpit
# validates against the forwarded Host header, which works for vortex.local
# and any LAN IP without hardcoding addresses.
[WebService]
UrlRoot=/system
ProtocolHeader=X-Forwarded-Proto
AllowUnencrypted=true
