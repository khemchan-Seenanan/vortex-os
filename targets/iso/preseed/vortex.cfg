# Vortex OS automated console install (Ubuntu-Server-like experience).
# Interactive questions kept ON PURPOSE: the vortex user's password and the
# partitioning confirmation (never silently wipe a disk).

d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us

d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string vortex
d-i netcfg/get_domain string local

# Users: root login disabled; 'vortex' is the admin. Password is PROMPTED.
d-i passwd/root-login boolean false
d-i passwd/user-fullname string Vortex
d-i passwd/username string vortex
d-i passwd/user-uid string 1000

d-i clock-setup/utc boolean true
d-i time/zone string America/Guyana
d-i clock-setup/ntp boolean true

# Single-partition auto layout; the confirm screen stays interactive.
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
# (no partman/confirm preseeds — d-i shows the destructive-write confirmation)

d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string default

d-i finish-install/reboot_in_progress note

# The live filesystem already contains every Vortex package; just make sure
# each install gets a unique identity and first boot starts clean.
d-i preseed/late_command string \
    in-target sh -c "truncate -s0 /etc/machine-id; rm -f /var/lib/dbus/machine-id; rm -f /etc/ssh/ssh_host_*"
